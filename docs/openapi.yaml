    post:
      tags: [Import V2 - candidates]
      operationId: moveCandidateFigure
      summary: 调整候选题题图用途、选项或内联位置
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/import-flow-v2/candidates/{candidateId}/fix-session:
    parameters: [{ $ref: '#/components/parameters/CandidateId' }]
    post:
      tags: [Candidate fixes]
      operationId: createOrRestoreCandidateFixSession
      summary: 创建或恢复候选题人工修正会话
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/import-flow-v2/candidate-fix-sessions/{sessionId}:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    get:
      tags: [Candidate fixes]
      operationId: getCandidateFixSession
      summary: 获取人工修正会话和相对坐标选区
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/import-flow-v2/candidate-fix-sessions/{sessionId}/regions:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    put:
      tags: [Candidate fixes]
      operationId: saveCandidateFixRegions
      summary: "保存选区；请求体须包含 `regions` 与当前 `revision`"
      requestBody: { $ref: '#/components/requestBodies/CandidateFixRegions' }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/import-flow-v2/candidate-fix-sessions/{sessionId}/validate:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    post:
      tags: [Candidate fixes]
      operationId: validateCandidateFixSession
      summary: 校验选区会话能否完成
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/import-flow-v2/candidate-fix-sessions/{sessionId}/finalize:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    post:
      tags: [Candidate fixes]
      operationId: finalizeCandidateFixSession
      summary: 完成选区修正并将结果应用回候选题
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/import-flow-v2/candidate-fix-sessions/{sessionId}/reopen:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    post:
      tags: [Candidate fixes]
      operationId: reopenCandidateFixSession
      summary: 重新打开已完成的选区修正会话
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/import-flow-v2/resolve-import-job:
    get:
      tags: [Import V2 - jobs]
      operationId: resolveImportJob
      summary: 按 sourceDocumentId 或兼容 runId 解析导入批次
      parameters:
        - name: sourceDocumentId
          in: query
          schema: { type: string }
        - name: runId
          in: query
          schema: { type: string }
        - name: ensure
          in: query
          description: 对单文档资料默认创建关联批次；传 false 仅查询
          schema: { type: boolean, default: true }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/import-flow-v2/jobs:
    get:
      tags: [Import V2 - jobs]
      operationId: listImportJobs
      summary: 分页列出导入批次及统计
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/SearchQuery' }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
    post:
      tags: [Import V2 - jobs]
      operationId: createImportJob
      summary: 创建单文档或分离题干/解析的导入批次
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '201': { $ref: '#/components/responses/CreatedJsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/import-flow-v2/jobs/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Import V2 - jobs]
      operationId: getImportJob
      summary: 获取导入批次、关联资料和统计
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Import V2 - jobs]
      operationId: updateImportJob
      summary: 更新导入批次元数据
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Import V2 - jobs]
      operationId: deleteImportJob
      summary: 删除导入批次
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/import-flow-v2/jobs/{id}/documents:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Import V2 - jobs]
      operationId: getImportJobDocuments
      summary: 获取批次及已关联的源资料
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Import V2 - jobs]
      operationId: addSourceDocumentToImportJob
      summary: 将已存在源资料关联到导入批次
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '201': { $ref: '#/components/responses/CreatedJsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/import-flow-v2/jobs/{id}/parse-candidates:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Import V2 - jobs]
      operationId: parseImportJobCandidates
      summary: 对批次资料执行候选题解析
      requestBody: { $ref: '#/components/requestBodies/ParseCandidates' }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/import-flow-v2/jobs/{id}/candidates:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Import V2 - jobs]
      operationId: listImportJobCandidates
      summary: 列出批次下所有候选题
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/import-flow-v2/jobs/{id}/questions:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Import V2 - jobs]
      operationId: listImportJobQuestions
      summary: 列出批次已提交至题库的题目
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/import-flow-v2/jobs/{id}/classify:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Import V2 - jobs]
      operationId: classifyImportJobQuestions
      summary: 分类此导入批次已提交的题目
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/import-flow-v2/jobs/{id}/model-split:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Import V2 - jobs]
      operationId: createModelSplitPreview
      summary: 生成模型辅助拆题预览
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/import-flow-v2/jobs/{id}/model-split/stream:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Import V2 - jobs]
      operationId: streamModelSplitPreview
      summary: 以 Server-Sent Events 流式生成模型辅助拆题预览
      responses:
        '200': { $ref: '#/components/responses/EventStream' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/import-flow-v2/jobs/{id}/model-split/{runId}/apply:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { $ref: '#/components/parameters/RunId' }
    post:
      tags: [Import V2 - jobs]
      operationId: applyModelSplitPreview
      summary: 应用已确认的模型拆题预览
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/import-flow-v2/jobs/{id}/export-records:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Import V2 - jobs]
      operationId: listImportJobExportRecords
      summary: 列出导入批次的导出历史
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/import-flow-v2/jobs/{id}/export:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Import V2 - jobs]
      operationId: exportImportJob
      summary: 按导出请求导出批次中已提交的题目
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  # New paths are inserted above this marker; reusable definitions stay last.
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: qm_session
      description: 部署实际 Cookie 名可随安全配置改变；浏览器客户端应让服务端设置并自动携带 Cookie。
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    FigureId:
      name: figureId
      in: path
      required: true
      schema: { type: string }
    RelationId:
      name: relationId
      in: path
      required: true
      schema: { type: string }
    DraftId:
      name: draftId
      in: path
      required: true
      schema: { type: string }
    AssetId:
      name: assetId
      in: path
      required: true
      schema: { type: string }
    CandidateId:
      name: candidateId
      in: path
      required: true
      schema: { type: string }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string }
    BlockId:
      name: blockId
      in: path
      required: true
      schema: { type: string }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string }
    SearchQuery:
      name: q
      in: query
      schema: { type: string }
    Stage:
      name: stage
      in: query
      schema: { type: string }
    QuestionType:
      name: questionType
      in: query
      schema: { type: string }
    KnowledgePoint:
      name: knowledgePoint
      in: query
      schema: { type: string }
    SolutionMethod:
      name: solutionMethod
      in: query
      schema: { type: string }
    Difficulty:
      name: difficulty
      in: query
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1 }
    DateFrom:
      name: from
      in: query
      schema: { type: string, format: date }
    DateTo:
      name: to
      in: query
      schema: { type: string, format: date }
    ActivityMetric:
      name: metric
      in: query
      schema:
        type: string
        enum: [all, questions_created, questions_updated, exports_created, ocr_completed]
  requestBodies:
    Credentials:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [username, password]
            properties:
              username: { type: string }
              password: { type: string, format: password }
    BootstrapCredentials:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Credentials'
              - type: object
                properties:
                  bootstrapToken: { type: string }
    ChangePassword:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [currentPassword, newPassword]
            properties:
              currentPassword: { type: string, format: password }
              newPassword: { type: string, format: password }
    JsonObject:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/JsonObject' }
    QuestionItem:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/QuestionItemInput' }
    Revision:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [revision]
            properties:
              revision: { type: integer, minimum: 1 }
            additionalProperties: true
    CandidateIds:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [candidateIds]
            properties:
              candidateIds:
                type: array
                minItems: 1
                items: { type: string }
            additionalProperties: true
    CandidateFixRegions:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [regions, revision]
            properties:
              revision: { type: integer, minimum: 1 }
              regions:
                type: array
                items: { $ref: '#/components/schemas/JsonObject' }
    OcrMarkdown:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [markdown]
            properties:
              markdown: { type: string }
    ParseCandidates:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              presetId: { type: string }
              configOverride: { $ref: '#/components/schemas/JsonObject' }
    TeachingDocumentCreate:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [title, documentType]
            properties:
              title: { type: string }
              documentType: { type: string, enum: [lecture, worksheet, exam] }
              content: { $ref: '#/components/schemas/JsonObject' }
    TeachingDocumentUpdate:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [expectedRevision]
            properties:
              expectedRevision: { type: integer, minimum: 1 }
              title: { type: string }
              content: { $ref: '#/components/schemas/JsonObject' }
    TikzSource:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [source]
            properties:
              source: { type: string }
    TikzFigure:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [source, usage]
            properties:
              source: { type: string }
              usage: { type: string, enum: [stem, options, analysis] }
              optionLabel: { type: string }
    MultipartFile:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file: { type: string, format: binary }
    MultipartFileWithFigureUsage:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file, usage]
            properties:
              file: { type: string, format: binary }
              usage: { type: string, enum: [stem, options, analysis] }
              optionLabel: { type: string }
    MultipartSourceDocument:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file: { type: string, format: binary }
              metadata:
                type: string
                description: JSON 字符串形式的资料元数据
  responses:
    Ok:
      description: 操作成功
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Ok' }
    JsonObject:
      description: 操作成功，响应结构由具体资源决定
      content:
        application/json:
          schema: { $ref: '#/components/schemas/JsonObject' }
    CreatedJsonObject:
      description: 资源已创建
      content:
        application/json:
          schema: { $ref: '#/components/schemas/JsonObject' }
    AcceptedJsonObject:
      description: 异步任务已受理
      content:
        application/json:
          schema: { $ref: '#/components/schemas/JsonObject' }
    Authenticated:
      description: 已创建会话，并在 Set-Cookie 中返回会话 Cookie
      headers:
        Set-Cookie:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuthState' }
    BadRequest:
      description: 请求或业务校验失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: 未登录或会话过期
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Origin 或 CSRF 校验失败，或权限不足
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: 资源状态、唯一约束或 revision 冲突
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: 登录或初始化限流
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Image:
      description: 已渲染的源资料页面图片
      content:
        image/png:
          schema: { type: string, format: binary }
        image/jpeg:
          schema: { type: string, format: binary }
    EventStream:
      description: "模型拆题事件流；每条事件为 `event: <name>` 加 JSON `data`。"
      content:
        text/event-stream:
          schema: { type: string }
    RevisionConflict:
      description: 教学文档的 expectedRevision 与服务端当前 revision 不匹配
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RevisionConflict' }
    ValidationFailed:
      description: 教学文档 JSON 未通过服务端结构校验
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    JsonObject:
      type: object
      additionalProperties: true
    Ok:
      type: object
      properties:
        ok: { type: boolean }
      additionalProperties: true
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string }
        details: {}
      additionalProperties: true
    Credentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    AuthState:
      type: object
      properties:
        initialized: { type: boolean }
        authenticated: { type: boolean }
        csrfToken: { type: string }
        admin:
          type: object
          properties:
            username: { type: string }
        accountManagementAvailable: { type: boolean }
      additionalProperties: true
    QuestionItemInput:
      type: object
      properties:
        questionNo: { type: string }
        stage: { type: string }
        subject: { type: string }
        questionType: { type: string }
        stemMarkdown: { type: string }
        answerText: { type: string }
        analysisMarkdown: { type: string }
        knowledgePoints:
          type: array
          items: { type: string }
        solutionMethods:
          type: array
          items: { type: string }
        bankStatus: { type: string, enum: [ready, blocked] }
      additionalProperties: true
    RevisionConflict:
      type: object
      required: [error, expectedRevision, actualRevision, current]
      properties:
        error: { type: string, const: revision_conflict }
        message: { type: string }
        expectedRevision: { type: integer }
        actualRevision: { type: integer }
        current: { $ref: '#/components/schemas/JsonObject' }
      additionalProperties: true
