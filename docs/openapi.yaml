openapi: 3.1.1
info:
  title: Question Manager Local API
  version: 0.1.1
  description: |
    Question Manager 的本地优先 REST API。此规范覆盖 server/src/index.ts 挂载的
    已实现路由；动态领域对象保留为开放 JSON 对象，具体字段以服务层 contracts、
    TypeScript 类型和 docs/api.md 为准。

    默认 single-admin 模式下，除 `/livez` 和公开认证接口外均需会话 Cookie。所有
    POST、PUT、PATCH、DELETE 请求还必须带允许的 Origin 与 `X-QM-CSRF` 请求头。
    认证 Cookie 名称会随部署安全配置变化，因此以通用 `sessionCookie` 描述。
servers:
  - url: http://127.0.0.1:8797
    description: 默认源码开发服务
security:
  - sessionCookie: []
tags:
  - name: Liveness
  - name: Authentication
  - name: Settings
  - name: Question bank
  - name: Collections
  - name: Export records
  - name: Layout drafts
  - name: Learning tags
  - name: Quick actions
  - name: Dashboard
  - name: Import V2 - source documents
  - name: Import V2 - OCR documents
  - name: Import V2 - parser
  - name: Import V2 - candidates
  - name: Import V2 - jobs
  - name: Candidate fixes
  - name: Teaching documents
paths:
  /livez:
    get:
      tags: [Liveness]
      operationId: getLiveness
      summary: 匿名存活探针
      security: []
      responses:
        '200':
          description: 服务进程正常
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, const: true }

  /api/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: 登录并创建 Cookie 会话
      description: 需要允许的 Origin。成功时设置 HttpOnly 会话 Cookie，并在响应中提供 CSRF token。
      security: []
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        '200': { $ref: '#/components/responses/Authenticated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/auth/bootstrap:
    post:
      tags: [Authentication]
      operationId: bootstrapAdmin
      summary: 首次创建管理员
      description: "仅在尚未初始化时可用；如配置 ADMIN_BOOTSTRAP_TOKEN，请求体还需 `bootstrapToken`。"
      security: []
      requestBody:
        $ref: '#/components/requestBodies/BootstrapCredentials'
      responses:
        '201': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/auth/state:
    get:
      tags: [Authentication]
      operationId: getAuthState
      summary: 查询初始化和当前会话状态
      security: []
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
  /api/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: 注销当前会话
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/auth/change-password:
    post:
      tags: [Authentication]
      operationId: changePassword
      summary: 修改管理员密码并注销其他会话
      requestBody:
        $ref: '#/components/requestBodies/ChangePassword'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/auth/sessions:
    get:
      tags: [Authentication]
      operationId: listSessions
      summary: 列出管理员会话
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/sessions/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    delete:
      tags: [Authentication]
      operationId: revokeSession
      summary: 注销指定会话
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/health:
    get:
      tags: [Settings]
      operationId: getHealth
      summary: 获取受保护的运行环境与工具健康信息
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/settings:
    get:
      tags: [Settings]
      operationId: getSettings
      summary: 获取 OCR 和应用设置（不返回完整密钥）
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
    patch:
      tags: [Settings]
      operationId: updateSettings
      summary: 更新 OCR 和应用设置
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/question-bank/items:
    get:
      tags: [Question bank]
      operationId: listQuestionBankItems
      summary: 分页检索题库题目
      parameters:
        - { $ref: '#/components/parameters/SearchQuery' }
        - { $ref: '#/components/parameters/Stage' }
        - { $ref: '#/components/parameters/QuestionType' }
        - { $ref: '#/components/parameters/KnowledgePoint' }
        - { $ref: '#/components/parameters/SolutionMethod' }
        - { $ref: '#/components/parameters/Difficulty' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
    post:
      tags: [Question bank]
      operationId: createQuestionBankItem
      summary: 创建一条题库题目
      requestBody: { $ref: '#/components/requestBodies/QuestionItem' }
      responses:
        '201': { $ref: '#/components/responses/CreatedJsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/question-bank/items/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Question bank]
      operationId: getQuestionBankItem
      summary: 获取题目详情
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Question bank]
      operationId: updateQuestionBankItem
      summary: "更新题目；可传 `expectedContentRevision` 防止覆盖"
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Question bank]
      operationId: deleteQuestionBankItem
      summary: 删除题目
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/question-bank/items/{id}/rerun-ocr:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Question bank]
      operationId: rerunQuestionItemOcr
      summary: 针对既有题目重新执行 OCR
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/question-bank/items/classify:
    post:
      tags: [Question bank]
      operationId: startQuestionBankClassification
      summary: 启动全题库分类任务
      responses:
        '202': { $ref: '#/components/responses/AcceptedJsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/question-bank/classification-tasks/active:
    get:
      tags: [Question bank]
      operationId: getActiveQuestionBankClassificationTask
      summary: 获取当前活跃分类任务
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
  /api/question-bank/classification-tasks/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Question bank]
      operationId: getQuestionBankClassificationTask
      summary: 获取分类任务状态
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/question-bank/import-json:
    post:
      tags: [Question bank]
      operationId: importQuestionBankJson
      summary: 批量导入题库 JSON
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '201': { $ref: '#/components/responses/CreatedJsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/question-bank/items/{id}/figures:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Question bank]
      operationId: createQuestionFigure
      summary: 按已有本地源图裁剪并绑定题图
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '201': { $ref: '#/components/responses/CreatedJsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/question-bank/items/{id}/figures/upload:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Question bank]
      operationId: uploadQuestionFigure
      summary: 上传题目题图
      requestBody: { $ref: '#/components/requestBodies/MultipartFileWithFigureUsage' }
      responses:
        '201': { $ref: '#/components/responses/CreatedJsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/question-bank/items/{id}/figures/{figureId}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { $ref: '#/components/parameters/FigureId' }
    patch:
      tags: [Question bank]
      operationId: updateQuestionFigure
      summary: 更新题图裁剪/绑定信息
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      tags: [Question bank]
      operationId: deleteQuestionFigure
      summary: 删除题图
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/question-bank/items/{id}/figures/tikz/preview:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Question bank]
      operationId: previewQuestionTikzFigure
      summary: 渲染题目 TikZ 预览，不保存
      requestBody: { $ref: '#/components/requestBodies/TikzSource' }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/question-bank/items/{id}/figures/tikz:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Question bank]
      operationId: createQuestionTikzFigure
      summary: 渲染并保存题目 TikZ 题图
      requestBody: { $ref: '#/components/requestBodies/TikzFigure' }
      responses:
        '201': { $ref: '#/components/responses/CreatedJsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/question-bank/items/{id}/figures/{figureId}/tikz:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { $ref: '#/components/parameters/FigureId' }
    patch:
      tags: [Question bank]
      operationId: updateQuestionTikzFigure
      summary: 重新渲染并更新已保存的 TikZ 题图
      requestBody: { $ref: '#/components/requestBodies/TikzFigure' }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/question-bank/tag-libraries:
    get:
      tags: [Learning tags]
      operationId: getQuestionBankTagLibraries
      summary: 获取题库可用的知识点和解题方法标签库
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
  /api/learning-tags/libraries:
    get:
      tags: [Learning tags]
      operationId: listLearningTagLibraries
      summary: 列出用户学习标签库
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
    post:
      tags: [Learning tags]
      operationId: createLearningTagLibrary
      summary: 创建或写入学习标签库
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/learning-tags/libraries/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    delete:
      tags: [Learning tags]
      operationId: deleteLearningTagLibrary
      summary: 删除非默认学习标签库
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/question-bank/collections:
    get:
      tags: [Collections]
      operationId: listCollections
      summary: 列出试题篮/收藏集合
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
    post:
      tags: [Collections]
      operationId: createCollection
      summary: 创建试题篮/收藏集合
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '201': { $ref: '#/components/responses/CreatedJsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/question-bank/collections/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Collections]
      operationId: getCollection
      summary: 获取集合及其题目关系
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Collections]
      operationId: updateCollection
      summary: 更新集合元数据
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      tags: [Collections]
      operationId: deleteCollection
      summary: 删除集合
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/question-bank/collections/{id}/items:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Collections]
      operationId: addCollectionItem
      summary: 将题目加入集合
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '201': { $ref: '#/components/responses/CreatedJsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
    put:
      tags: [Collections]
      operationId: replaceCollectionItems
      summary: 整体替换集合的题目顺序和内容
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      tags: [Collections]
      operationId: clearCollectionItems
      summary: 清空集合中的题目
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
  /api/question-bank/collections/{id}/items/{relationId}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { $ref: '#/components/parameters/RelationId' }
    patch:
      tags: [Collections]
      operationId: updateCollectionItem
      summary: 更新集合题目关系（分数、分区等）
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      tags: [Collections]
      operationId: deleteCollectionItem
      summary: 从集合移除一题
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/question-bank/collections/{id}/reorder:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Collections]
      operationId: reorderCollectionItems
      summary: 按 relationId 与 sortOrder 重排集合题目
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/question-bank/collections/{id}/export:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Collections]
      operationId: exportCollection
      summary: 导出集合为 Markdown、LaTeX 或 PDF
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/question-bank/export-records:
    get:
      tags: [Export records]
      operationId: listExportRecords
      summary: 检索导出历史
      parameters:
        - { $ref: '#/components/parameters/SearchQuery' }
        - name: sourceType
          in: query
          schema: { type: string, enum: [collection, run, import_job] }
        - name: collectionId
          in: query
          schema: { type: string }
        - name: runId
          in: query
          schema: { type: string }
        - name: importJobId
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
  /api/question-bank/export-records/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    delete:
      tags: [Export records]
      operationId: deleteExportRecord
      summary: 删除导出历史记录
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/question-bank/export-records/{id}/restore-to-basket:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Export records]
      operationId: restoreExportRecordToBasket
      summary: 从导出快照恢复题目到集合
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/question-bank/collections/{id}/export-records:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Export records]
      operationId: listCollectionExportRecords
      summary: 列出指定集合的导出历史
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/question-bank/quick-action-metadata:
    get:
      tags: [Quick actions]
      operationId: getQuickActionMetadata
      summary: 获取随机组卷可用的筛选元数据
      parameters:
        - { $ref: '#/components/parameters/Stage' }
        - name: knowledgePoints
          in: query
          description: 逗号分隔的标签列表
          schema: { type: string }
        - name: solutionMethods
          in: query
          description: 逗号分隔的标签列表
          schema: { type: string }
        - name: matchMode
          in: query
          schema: { type: string, enum: [strict, loose] }
        - name: difficultyMode
          in: query
          schema: { type: string, enum: [foundation, standard, advanced, challenge, custom] }
        - name: difficultyMin
          in: query
          schema: { type: number, minimum: 1, maximum: 10 }
        - name: difficultyMax
          in: query
          schema: { type: number, minimum: 1, maximum: 10 }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
  /api/question-bank/daily-question:
    get:
      tags: [Quick actions]
      operationId: getDailyQuestion
      summary: 按可选标签随机获取每日一题
      parameters:
        - { $ref: '#/components/parameters/Stage' }
        - name: knowledgePoint
          in: query
          schema: { type: string }
        - name: solutionMethod
          in: query
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
  /api/question-bank/random-paper:
    post:
      tags: [Quick actions]
      operationId: generateRandomPaper
      summary: 按题型、难度和标签随机组卷
      requestBody: { $ref: '#/components/requestBodies/JsonObject' }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/dashboard/activity-heatmap:
    get:
      tags: [Dashboard]
      operationId: getActivityHeatmap
      summary: 获取按日活动热力图
      parameters:
        - { $ref: '#/components/parameters/DateFrom' }
        - { $ref: '#/components/parameters/DateTo' }
        - { $ref: '#/components/parameters/ActivityMetric' }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
  /api/dashboard/activity-hours:
    get:
      tags: [Dashboard]
      operationId: getActivityHours
      summary: 获取按时段活动统计
      parameters:
        - { $ref: '#/components/parameters/DateFrom' }
        - { $ref: '#/components/parameters/DateTo' }
        - { $ref: '#/components/parameters/ActivityMetric' }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }

  /api/question-bank/layout-drafts:
    get:
      tags: [Layout drafts]
      operationId: searchLayoutDrafts
      summary: 分页检索排版草稿
      parameters:
        - { $ref: '#/components/parameters/SearchQuery' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
  /api/question-bank/collections/{id}/layout-drafts:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Layout drafts]
      operationId: listCollectionLayoutDrafts
      summary: 列出集合下的排版草稿
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
